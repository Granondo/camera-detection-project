# RabbitMQ Configuration

# Network
listeners.tcp.default = 5672

# Management plugin
management.tcp.port = 15672

# Memory & Disk
vm_memory_high_watermark.relative = 0.6
disk_free_limit.relative = 1.0

# Default user (will be overridden by env vars)
default_user = admin
default_pass = rabbitmq_password
default_vhost = /

# Logging
log.console = true
log.console.level = info

# Queue settings
queue_master_locator = min-masters

# Heartbeat
heartbeat = 60

# Channel limits
channel_max = 2048

# Performance
hipe_compile = false