version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: surveillance-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-surveillance}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/
    restart: unless-stopped
    networks:
      - surveillance-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: surveillance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # YOLO Detection Service
  detection-service:
    build: 
      context: ./detection_service
      dockerfile: Dockerfile
    container_name: yolo-detection-service
    environment:
      - YOLO_MODEL_PATH=yolov8n.pt
      - CONFIDENCE_THRESHOLD=0.5
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false
    ports:
      - "5001:5000"
    volumes:
      - ./output:/app/data
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
  
  # API Server
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: surveillance-api
    depends_on:
      - postgres
      - redis
    environment:
      - API_PORT=8080
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-surveillance}
      - DATABASE_SSL_MODE=disable
      - OUTPUT_DIR=/app/output
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - REDIS_DB=0
    ports:
      - "8080:8080"
    volumes:
      - ./output:/app/output:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Camera Detection Application
  camera-detection:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: camera-detection
    depends_on:
      - postgres
      - redis
      - detection-service
    environment:
      # Camera Configuration
      - RTSP_URL=${RTSP_URL:-rtsp://192.168.1.100:554/stream1}
      - CAMERA_USERNAME=${CAMERA_USERNAME:-admin}
      - CAMERA_PASSWORD=${CAMERA_PASSWORD}
      - CAMERA_TIMEOUT=${CAMERA_TIMEOUT:-30}
      - FRAME_RATE=${FRAME_RATE:-5}
      - SAVE_FRAMES=${SAVE_FRAMES:-true}
      - OUTPUT_DIR=/app/output
      - FFMPEG_PATH=ffmpeg
      - DETECTION_ENABLED=${DETECTION_ENABLED:-true}
      
      # Detection Service Configuration
      - DETECTION_SERVICE_URL=http://detection-service:5000
      - DETECTION_SERVICE_TIMEOUT=30
      - DETECTION_SERVICE_MAX_RETRIES=3
      - DETECTION_CONFIDENCE_THRESHOLD=0.5
      
      # Database Configuration
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-surveillance}
      - DATABASE_SSL_MODE=disable
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - REDIS_DB=0
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - surveillance-network
    ports:
      - "8090:8080"

  # Svelte UI Development Server
  surveillance-ui:
    build:
      context: ./surveillance-ui
      dockerfile: Dockerfile.dev
    container_name: surveillance-ui
    ports:
      - "5173:5173"
    volumes:
      - ./surveillance-ui:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: npm run dev -- --host
    networks:
      - surveillance-network
  
  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: surveillance-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@surveillance.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8081:80"
    depends_on:
      - postgres
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - surveillance-network

  # Redis Commander (optional - Redis UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: surveillance-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-redis_password}
    ports:
      - "8082:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - surveillance-network

networks:
  surveillance-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
  camera_output:
    driver: local
  camera_logs:
    driver: local