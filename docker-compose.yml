version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15
    container_name: surveillance-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-surveillance}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: surveillance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_password}
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: surveillance-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-rabbitmq_password}
      - RABBITMQ_DEFAULT_VHOST=/
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
      - "15692:15692" # Prometheus metrics
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ClickHouse Analytics Database
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: surveillance-clickhouse
    ports:
      - "8123:8123"  # HTTP interface
      - "9000:9000"  # Native interface
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d/
    environment:
      - CLICKHOUSE_DB=surveillance
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_password}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # YOLO Detection Service
  detection-service:
    build: 
      context: ./detection_service
      dockerfile: Dockerfile
    container_name: yolo-detection-service
    environment:
      - YOLO_MODEL_PATH=yolov8n.pt
      - CONFIDENCE_THRESHOLD=0.5
      - HOST=0.0.0.0
      - PORT=5000
      - DEBUG=false
    ports:
      - "5001:5000"
    volumes:
      - ./output:/app/data
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  detection-worker:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      detection-service:
        condition: service_started
    environment:
      # Database
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-surveillance}
      - DATABASE_SSL_MODE=disable
      
      # RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-rabbitmq_password}
      - RABBITMQ_VHOST=/
      - RABBITMQ_ENABLED=true
      
      # Detection Service
      - DETECTION_SERVICE_URL=http://detection-service:5000
      - DETECTION_SERVICE_TIMEOUT=30
      - DETECTION_CONFIDENCE_THRESHOLD=0.5
      
      # ClickHouse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_password}
      - CLICKHOUSE_DATABASE=surveillance
      
      - OUTPUT_DIR=/app/output
    volumes:
      - ./output:/app/output:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - surveillance-network
    # Можно запустить несколько workers для параллельной обработки
    deploy:
      replicas: 2
  
  # API Server
  api-server:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: surveillance-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - API_PORT=8080
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-surveillance}
      - DATABASE_SSL_MODE=disable
      - OUTPUT_DIR=/app/output
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - REDIS_DB=0
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_password}
      - CLICKHOUSE_DATABASE=surveillance
      - ELASTICSEARCH_ENABLED=${ELASTICSEARCH_ENABLED:-true}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=surveillance-events
    ports:
      - "8080:8080"
    volumes:
      - ./output:/app/output:ro
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Camera Detection Application
  camera-detection:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: camera-detection
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      detection-service:
        condition: service_started
    environment:
      # Camera Configuration
      - RTSP_URL=${RTSP_URL:-rtsp://192.168.1.100:554/stream1}
      - CAMERA_USERNAME=${CAMERA_USERNAME:-admin}
      - CAMERA_PASSWORD=${CAMERA_PASSWORD}
      - CAMERA_TIMEOUT=${CAMERA_TIMEOUT:-30}
      - FRAME_RATE=${FRAME_RATE:-5}
      - SAVE_FRAMES=${SAVE_FRAMES:-true}
      - OUTPUT_DIR=/app/output
      - FFMPEG_PATH=ffmpeg
      - DETECTION_ENABLED=${DETECTION_ENABLED:-true}
      
      # Detection Service Configuration
      - DETECTION_SERVICE_URL=http://detection-service:5000
      - DETECTION_SERVICE_TIMEOUT=30
      - DETECTION_SERVICE_MAX_RETRIES=3
      - DETECTION_CONFIDENCE_THRESHOLD=0.5
      
      # Database Configuration
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-surveillance}
      - DATABASE_SSL_MODE=disable
      
      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
      - REDIS_DB=0
      
      # ClickHouse Configuration
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-clickhouse_password}
      - CLICKHOUSE_DATABASE=surveillance

      # Elasticsearch Configuration
      - ELASTICSEARCH_ENABLED=${ELASTICSEARCH_ENABLED:-true}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - ELASTICSEARCH_INDEX=surveillance-events
    volumes:
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - surveillance-network
    ports:
      - "8090:8080"

  # Svelte UI Development Server
  surveillance-ui:
    build:
      context: ./surveillance-ui
      dockerfile: Dockerfile.dev
    container_name: surveillance-ui
    ports:
      - "5173:5173"
    volumes:
      - ./surveillance-ui:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080
    command: pnpm run dev --host
    networks:
      - surveillance-network

  # Next.js UI
  surveillance-next:
    build:
      context: ./surveillance-next
      dockerfile: Dockerfile
    container_name: surveillance-next
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api-server:8080
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - api-server
    networks:
      - surveillance-network
    restart: unless-stopped
  
  # pgAdmin for database management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: surveillance-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@surveillance.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8081:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped
    networks:
      - surveillance-network

  # Redis Commander (optional - Redis UI)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: surveillance-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-redis_password}
    ports:
      - "8082:8081"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - surveillance-network

  # Tabix - ClickHouse Web UI (optional)
  tabix:
    image: spoonest/clickhouse-tabix-web-client:latest
    container_name: surveillance-tabix
    ports:
      - "8083:80"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - surveillance-network

  # Elasticsearch - Search Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: surveillance-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Kibana - Elasticsearch UI
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: surveillance-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - surveillance-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: surveillance-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    restart: unless-stopped
    networks:
      - surveillance-network

  # Grafana - Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: surveillance-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - surveillance-network

  # Node Exporter - Host Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: surveillance-node-exporter
    ports:
      - "9100:9100"
    restart: unless-stopped
    networks:
      - surveillance-network

  # PostgreSQL Exporter
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: surveillance-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-surveillance}?sslmode=disable
    ports:
      - "9187:9187"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - surveillance-network

  # Redis Exporter
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: surveillance-redis-exporter
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_password}
    ports:
      - "9121:9121"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - surveillance-network

networks:
  surveillance-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  pgadmin_data:
    driver: local
  camera_output:
    driver: local
  camera_logs:
    driver: local
  rabbitmq_data:
    driver: local
  elasticsearch_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local