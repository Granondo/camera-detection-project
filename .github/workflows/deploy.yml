# GitHub Actions Workflow for Simple Deployment
# This workflow automates the deployment to a home server.

name: Deploy to Home Server

# Triggers the workflow on push events to the main branch
on:
  push:
    branches:
      - main

jobs:
  deploy:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code from the repository
      # This is necessary so that the workflow can access the repository's code,
      # though it's not strictly needed for this particular script which pulls on the server.
      # It's good practice to include it.
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: SSH into the server and run the deployment script
      # This step uses the popular 'appleboy/ssh-action' to securely connect
      # to the home server and execute the deploy.sh script.
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT || 22 }} # Default to port 22 if not specified
          script: |
            # Navigate to the project directory on the server
            cd /path/to/your/camera-detection-project
            
            # Execute the deployment script
            bash deploy.sh
            
            # (Optional) Prune old docker images and volumes to save space
            docker system prune -af

# Instructions for the user (to be added to the pull request description or communicated separately):
#
# To make this workflow functional, you need to add the following secrets to your GitHub repository settings:
#
# 1. Go to your repository on GitHub.
# 2. Click on "Settings" > "Secrets and variables" > "Actions".
# 3. Click "New repository secret" for each of the following:
#
#    - HOST: The IP address or domain name of your home server.
#      (e.g., 192.168.1.100 or my-server.example.com)
#
#    - USERNAME: The username you use to SSH into your server.
#      (e.g., ubuntu, pi, or your custom username)
#
#    - KEY: The private SSH key that has access to your server.
#      **Important:** This is the private key (e.g., contents of ~/.ssh/id_rsa), NOT the public key.
#      It's recommended to create a dedicated SSH key pair for this deployment process.
#
#    - PORT: (Optional) The SSH port of your server if it's not the default (22).
#
# You also need to update the `cd /path/to/your/camera-detection-project` line in this workflow file
# to the absolute path of your project directory on the server.
